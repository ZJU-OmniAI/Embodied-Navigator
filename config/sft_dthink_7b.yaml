# ====== SFTConfig ======
output_dir: runs/DThinkVLN-7B-SFT-S2-V2
deepspeed: config/zero2.json
per_device_train_batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 5e-5
logging_steps: 1
bf16: true
# report_to: wandb
gradient_checkpointing: true
attn_implementation: flash_attention_2
num_train_epochs: 1
run_name: DThinkVLN-7B-SFT
save_steps: 30
max_length: 4096
max_grad_norm: 5
save_only_model: true
dataloader_num_workers: 1

use_liger_kernel: true
dataloader_persistent_workers: true


# ====== ModelConfig ======
model_name_or_path: model/DThinkVLN-7B-SFT-S1
trust_remote_code: true
torch_dtype: auto

# ====== DatasetConfig ======
dataset_merge_type: count_rand
datasets:
  - type: dthink_episode_stream
    path: data/dthink_sft_data/data_buffer
    splits: ["unseen"]
    num_samples: 250000
  - type: gqa_interleaved_cot
    path: data/share/GQA_Interleaved_COT
    splits: ["train_med_fixed", "train_easy", "train_hard"]
